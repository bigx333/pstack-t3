<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">pstack-t3</title>
  <desc id="desc">One T3 thread leads and fans work out to Claude, Codex, Grok, and Cursor through T3's orchestrator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1117"/>
      <stop offset="1" stop-color="#1a1d29"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <text x="72" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="64" font-weight="700" fill="#f5f5f7">pstack-t3</text>
  <text x="72" y="182" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#a1a1aa">One rigorous workflow. Every model you have.</text>
  <text x="72" y="222" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#71717a">Lauren Tan's pstack, ported to T3 Code's orchestrator.</text>
  <text x="72" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#e4e4e7">$poteto-mode  $interrogate  $swarm  $arena</text>

  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle">
    <rect x="770" y="58" width="300" height="52" rx="12" fill="#27272a" stroke="#52525b"/>
    <text x="920" y="90" fill="#f5f5f7" font-weight="600">your T3 thread leads</text>
    <line x1="920" y1="110" x2="920" y2="150" stroke="#52525b" stroke-width="2"/>
    <rect x="740" y="150" width="360" height="44" rx="10" fill="#1e293b" stroke="#3b82f6"/>
    <text x="920" y="178" fill="#bfdbfe">T3 orchestrator · delegate_task</text>
    <path d="M800 194 L760 244 M880 194 L870 244 M960 194 L970 244 M1040 194 L1080 244" stroke="#52525b" stroke-width="2" fill="none"/>
    <rect x="712" y="244" width="96" height="40" rx="20" fill="#2a2320" stroke="#d97757"/>
    <text x="760" y="270" fill="#f4c7b4">Claude</text>
    <rect x="822" y="244" width="96" height="40" rx="20" fill="#1f2a24" stroke="#10a37f"/>
    <text x="870" y="270" fill="#b6e8d6">Codex</text>
    <rect x="932" y="244" width="96" height="40" rx="20" fill="#26262b" stroke="#a1a1aa"/>
    <text x="980" y="270" fill="#e4e4e7">Grok</text>
    <rect x="1042" y="244" width="96" height="40" rx="20" fill="#1f2937" stroke="#22c55e"/>
    <text x="1090" y="270" fill="#bbf7d0">Cursor</text>
    <text x="925" y="318" fill="#71717a" font-size="15">any thread can lead, every family can review</text>
  </g>
</svg>
